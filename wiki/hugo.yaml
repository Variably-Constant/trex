# Hugo config for the trex documentation site, built with the Hextra
# theme (consumed as a Hugo Module - no submodule, no vendored theme
# tree; `hugo mod get -u` updates it).
#
# Build: `hugo --gc --minify --baseURL <pages-base-url>/`
# Local: `hugo serve` then open the printed http://localhost:1313/.

baseURL: https://variably-constant.github.io/trex/
title: trex
languageCode: en-us

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      # Required for Hextra shortcodes that emit raw HTML (cards,
      # callouts, tabs).
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: https://github.com/Variably-Constant/trex
      params:
        icon: github

params:
  description: >-
    Token-Regular EXpression: a regex-shaped pattern language over typed
    tokens, matched by derivatives with long-distance binding and no
    catastrophic backtracking.

  navbar:
    displayTitle: true
    # No logo image ships with the crate; the text title is the brand.
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: https://github.com/Variably-Constant/trex/edit/main/wiki/content

  theme:
    default: system
    displayToggle: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
