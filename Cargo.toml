[profile.release]
# Fat LTO with one codegen unit for SIZE, not speed: it takes the binary from 50.2 MB to 28.9 MB,
# 42% smaller. Speed is untouched - a scan of an 8.1 MB corpus reads 111 ms here against 124 ms
# without LTO, and the spread between two cells differing only in `strip`, which changes nothing,
# is 13%, so no build option separates on scan time at all. Measured over all 24 combinations of
# strip, lto, codegen-units and panic.
#
# panic stays "unwind". Flynnel calls catch_unwind in 29 places including its scheduler arena, and
# gpu.rs catches the panic cudarc raises when the CUDA library is absent, which is what makes a
# host with no driver fall back to the CPU instead of dying. abort reaches 27.2 MB and breaks both.
lto = "fat"
codegen-units = 1

# The gate opts out of LTO deliberately. Inheriting it put every release test build at 83-94 s
# against 6 s here, and that is the number that stops people running gates. What this trades away
# is that the tested binary is inlined differently from the shipped one; it is acceptable only
# because the same sweep showed scan time is flat across LTO settings, so no test here is
# asserting on a property LTO can move.
[profile.release-test]
inherits = "release"
lto = "off"
codegen-units = 256
