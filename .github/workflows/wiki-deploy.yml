# Build and deploy the trex wiki (Hugo + Hextra) to GitHub Pages.
#
# Adapted from the canonical hextra-starter-template pages.yaml
# (github.com/imfing/hextra-starter-template/.github/workflows/pages.yaml),
# the same way the Flynnel and SubEtha wikis are deployed. Four deltas
# against the upstream starter: the trigger fires only on wiki/** or this
# workflow's own changes, so the rest of the repository pushes without a
# docs rebuild; the Hugo site lives at wiki/ rather than the root, so the
# build and the artifact are scoped to that directory; wiki/pattern_slots.py
# --check runs before the build, so a code block whose TREX slots in
# wiki/data/pattern_slots.json are out of date fails the deploy; and the
# built site is read by wiki/check_highlighting.py before the upload, so a
# code block the highlighter could not read, or left unhighlighted, fails
# the deploy.
name: Deploy trex Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run in progress is never canceled, so a
# production deployment always completes.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Check pattern slots
        working-directory: ./wiki
        run: python3 pattern_slots.py --check
      - name: Build with Hugo
        working-directory: ./wiki
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Check code highlighting
        working-directory: ./wiki
        run: python3 check_highlighting.py public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wiki/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
