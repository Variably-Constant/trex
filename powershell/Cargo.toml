[package]
name = "trex-pwrs"
version = "0.1.0"
authors = ["Mark Newton"]
edition = "2024"
rust-version = "1.98"
description = """trex as PowerShell cmdlets and objects: a regex-shaped pattern language over \
typed tokens. A pattern matches a whole number, word, quoted string, IP address, URL, email, \
timestamp, version and 17 more kinds as one atom each, binds named registers a later token \
must equal, and matches balanced bracket groups, with no backtracking. Custom atoms are \
declared for the session with Register-TrexAtom or read from pattern files with \
Import-TrexAtom, and every cmdlet reads them. Every cmdlet also answers to a shorter name \
with the Tx prefix. Bound to the Rust directly with PoWerRuSt (pwrs)."""
license = "MIT"
repository = "https://github.com/Variably-Constant/trex"
keywords = ["powershell", "regex", "tokens", "pattern-matching", "text-search", "cmdlet"]
# Ships as a PowerShell module, not to crates.io.
publish = false

# The module manifest's CompanyName, Copyright, LicenseUri and ReleaseNotes;
# Author is `authors` and ProjectUri is `repository`.
[package.metadata.pwrs]
company = "Variably Constant"
copyright = "(c) 2026 Mark Newton"
license-uri = "https://github.com/Variably-Constant/trex/blob/main/LICENSE-MIT"
release-notes = """The first release of Trex: trex's pattern language over typed \
tokens as PowerShell cmdlets and objects. Select-TrexMatch scans text, files and \
directory trees; Edit-TrexText rewrites, Protect-TrexText redacts, Group-TrexMatch \
counts and groups; Register-TrexAtom and Import-TrexAtom declare custom atoms every \
cmdlet reads; ConvertTo-TrexPattern builds a pattern from marked examples and \
ConvertFrom-TrexText applies it as objects, reading ConvertFrom-String templates. It \
imports in PowerShell 7 and Windows PowerShell 5.1."""

# The module's native library. Its name is the file every platform folder
# carries, kept apart from the `trex` binary's artifacts.
[lib]
name = "trex_pwrs"
crate-type = ["cdylib"]

[dependencies]
# The binding framework, published on crates.io as PoWerRuSt, since crates.io
# carries an unrelated `pwrs`; the library it builds is still `pwrs`, which is
# what the source writes. cargo-pwrs builds the module and takes the same
# version.
pwrs = { package = "PoWerRuSt", version = "0.3.1" }
# The engine with its default features, as every trex surface takes it.
trex = { package = "trex-re", path = ".." }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

# A workspace of its own, with its own lock and release profile, so building
# trex never builds PWRS.
[workspace]

# The module ships from the release profile. Unwinding stays on: PWRS turns a
# panic at the boundary into a terminating error, where abort would end the
# PowerShell process, and trex's own fallbacks catch panics as well.
[profile.release]
lto = "fat"
codegen-units = 1
